name: Deploy site

# UITGESCHAKELD per 2026-07-21 (canonical-migratie naar jochem25/open-bouwlab):
# deploy-doel open-aec.com (open-heatloss-studio.open-aec.com) resolvet naar
# 167.235.54.105 — Foundation-infra waar wij geen SSH-toegang (meer) op hebben.
# De app wordt geserveerd via warmteverlies.open-aec.com (eigen server, GHCR-image).
# Statische site verhuist bij de domein-migratie naar een kolthofbouwadvies.nl-subdomein;
# dan deploy-doel + reusable-workflow-ref (nu OpenAEC-Foundation/github) herzien.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-site
  cancel-in-progress: true

jobs:
  deploy:
    uses: OpenAEC-Foundation/github/.github/workflows/deploy-site.yml@b86eaa20b5cd10a1139c72daf7cf4bd0dcf7b00c # main (2026-03-25)
    with:
      deploy_host: ${{ vars.DEPLOY_HOST }}
      deploy_port: ${{ vars.DEPLOY_PORT }}
      deploy_user: ${{ vars.DEPLOY_USER }}
      deploy_path: /var/www/open-heatloss-studio.open-aec.com
      node_version: "22"
      install_command: cd frontend && npm ci
      build_command: cd frontend && npm run build
      deploy_source: frontend/dist
    secrets:
      deploy_ssh_key: ${{ secrets.DEPLOY_SSH_KEY }}
